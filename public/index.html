<!doctype html>
<meta charset="utf-8" />
<title>LifeOS</title>
<!--
  Root locale chooser. ARCHITECTURE.md §3.1: static export has no middleware, so
  locale detection cannot happen on the server. This file is the "tiny client
  redirect at root" the architecture calls for. Verified by SPIKE-01.
-->
<script>
  var supported = ['en', 'pl'];
  var pref = (navigator.language || 'en').slice(0, 2).toLowerCase();
  location.replace('/' + (supported.indexOf(pref) === -1 ? 'en' : pref) + '/');
</script>
<noscript><a href="/en/">English</a> · <a href="/pl/">Polski</a></noscript>
