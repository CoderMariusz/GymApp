<!-- @dsCard group="Components" viewport="700x400" name="Fitness" subtitle="Set rows, sync states, rest timer, stats, charts" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Fitness components</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-base);padding:16px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin-bottom:8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { SetRow, SyncBadge, RestTimer, StatCard, PRBadge, WeekDots, VolumeBars, TrendChart, ExerciseRow, Card } = window.LifeOSStrengthDesignSystem_576cfb;
function Demo(){
  return (<div className="col" style={{gap:18}}>
    <div className="row" style={{alignItems:'flex-start',gap:18}}>
      <div style={{flex:'1 1 330px'}}><div className="lbl">Set rows — logged · active · proposed · warm-up</div>
        <Card pad="tight">
          <div style={{display:'flex',gap:8,padding:'0 10px 6px 4px',fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text-tertiary)',fontWeight:700}}>
            <span style={{width:34,textAlign:'center'}}>Set</span><span style={{flex:1,textAlign:'center'}}>Weight</span><span style={{flex:1,textAlign:'center'}}>Reps</span><span style={{flex:1,textAlign:'center'}}>RIR</span><span style={{flex:1,textAlign:'center'}}>Rest</span><span style={{width:32}}></span>
          </div>
          <SetRow index={1} weight={60} reps={10} rir={4} rest="1:00" warmup state="logged"/>
          <SetRow index={1} weight={100} reps={8} rir={2} rest="2:00" state="logged"/>
          <SetRow index={3} weight={105} reps={8} rir={2} rest="1:45" state="active"/>
          <SetRow index={4} weight={105} reps={8} rir={2} rest="-" state="proposed"/>
        </Card>
      </div>
      <div style={{flex:'1 1 280px'}}><div className="lbl">Sync — six states, icon + word</div>
        <div className="row" style={{gap:8}}>
          <SyncBadge state="draft_local"/><SyncBadge state="queued"/><SyncBadge state="syncing"/>
          <SyncBadge state="saved"/><SyncBadge state="failed"/><SyncBadge state="conflict"/>
        </div>
        <div className="lbl" style={{marginTop:16}}>Records</div>
        <div className="row"><PRBadge/><PRBadge label="PR" detail="+5 kg"/></div>
      </div>
    </div>
    <div className="row" style={{alignItems:'stretch',gap:12}}>
      <StatCard style={{flex:1}} label="Volume" value="12,450" unit="kg" delta="+8%" footnote="vs last week" icon="trending-up"/>
      <StatCard style={{flex:1}} label="Workouts" value="4" footnote="This week" icon="calendar"/>
      <div style={{flex:1.4}}><div className="lbl">Rest timer</div><RestTimer remaining="1:45" running nextLabel="Next exercise" nextValue="Incline DB Press"/></div>
    </div>
    <div className="row" style={{alignItems:'flex-start',gap:16}}>
      <div style={{flex:1}}><div className="lbl">Volume bars</div><VolumeBars height={70} data={[8,12,6,14,9,17,11,15,7,13,19,10]} labels={['May 1','May 14','May 28']} highlightLast/></div>
      <div style={{flex:1}}><div className="lbl">Strength trend</div><TrendChart height={70} data={[62,68,66,74,80,86,90,88,94,96,102]} xLabels={['Apr 12','Jun 7']}/></div>
      <div style={{flex:1}}><div className="lbl">Week</div><WeekDots days={[{label:'M',done:true},{label:'T',done:true},{label:'W',done:true},{label:'T',done:true},{label:'F',done:true},{label:'S'},{label:'S'}]}/></div>
    </div>
    <div><div className="lbl">Exercise row</div><ExerciseRow name="Bench Press" meta="Barbell · Chest · last: 100 kg × 8, 5 days ago"/></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
