<!-- @dsCard group="Colors" viewport="700x160" name="Sync state roles" subtitle="Six states — queued reads as normal, never as a warning" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Sync</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:10px">
<span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--sync-draft-bg);color:var(--sync-draft-fg);font-size:11px;font-weight:800;min-width:96px">draft_local</span>
<span style="font-size:12px;color:var(--text-tertiary)">On this device, workout in progress</span></div><div style="display:flex;align-items:center;gap:10px">
<span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--sync-queued-bg);color:var(--sync-queued-fg);font-size:11px;font-weight:800;min-width:96px">queued</span>
<span style="font-size:12px;color:var(--text-tertiary)">Finished, waiting for connection</span></div><div style="display:flex;align-items:center;gap:10px">
<span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--sync-syncing-bg);color:var(--sync-syncing-fg);font-size:11px;font-weight:800;min-width:96px">syncing</span>
<span style="font-size:12px;color:var(--text-tertiary)">In transit</span></div><div style="display:flex;align-items:center;gap:10px">
<span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--sync-saved-bg);color:var(--sync-saved-fg);font-size:11px;font-weight:800;min-width:96px">saved</span>
<span style="font-size:12px;color:var(--text-tertiary)">On the server, confirmed</span></div><div style="display:flex;align-items:center;gap:10px">
<span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--sync-failed-bg);color:var(--sync-failed-fg);font-size:11px;font-weight:800;min-width:96px">failed</span>
<span style="font-size:12px;color:var(--text-tertiary)">Attempt failed, will retry</span></div><div style="display:flex;align-items:center;gap:10px">
<span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--sync-conflict-bg);color:var(--sync-conflict-fg);font-size:11px;font-weight:800;min-width:96px">conflict</span>
<span style="font-size:12px;color:var(--text-tertiary)">Needs a decision</span></div>
</div></body></html>
