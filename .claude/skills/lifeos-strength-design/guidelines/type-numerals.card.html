<!-- @dsCard group="Type" viewport="700x180" name="Numerals" subtitle="Tabular figures — read at arm's length, aligned in columns" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Numerals</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div style="display:flex;align-items:flex-end;gap:28px">
<div><span class="t">metric-hero · 44px</span><div style="font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:44px;line-height:44px;font-weight:700;letter-spacing:-.02em">105<span style="font-size:14px;color:var(--text-tertiary);margin-left:6px">kg</span></div></div>
<div><span class="t">metric · 28px</span><div style="font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.02em">18,750</div></div>
<div><span class="t">timer · 30px</span><div style="font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:30px;line-height:32px;font-weight:700;color:var(--action-primary)">01:15</div></div>
<div><span class="t">metric-sm · 17px · column</span><div style="font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:17px;line-height:22px;font-weight:700;text-align:right">100<br>107.5<br>60</div></div>
</div></body></html>
