<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Dark UI separates by surface step and hairline, not by shadow" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div style="display:flex;gap:12px">
<div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)"></div><span class="t" style="font-size:9px">shadow-card</span><span style="font-size:10px;color:var(--text-tertiary);line-height:13px">Cards — inset highlight only</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-raised)"></div><span class="t" style="font-size:9px">shadow-raised</span><span style="font-size:10px;color:var(--text-tertiary);line-height:13px">Sheets, popovers</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-float)"></div><span class="t" style="font-size:9px">shadow-float</span><span style="font-size:10px;color:var(--text-tertiary);line-height:13px">Dialogs</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-fab)"></div><span class="t" style="font-size:9px">shadow-fab</span><span style="font-size:10px;color:var(--text-tertiary);line-height:13px">Lime FAB glow</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--glow-accent)"></div><span class="t" style="font-size:9px">glow-accent</span><span style="font-size:10px;color:var(--text-tertiary);line-height:13px">Focus / active ring</span></div>
</div></body></html>
