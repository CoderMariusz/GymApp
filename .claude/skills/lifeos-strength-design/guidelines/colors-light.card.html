<!-- @dsCard group="Colors" viewport="700x140" name="Light theme" subtitle="Designed, not inverted — lime darkens to hold contrast on paper" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-base)}.sw{flex:1;height:88px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary)}</style></head><body>
<div style="display:flex;gap:10px">
<div class="sw" style="background:var(--surface-base)"><span class="n">surface-base</span><span class="v">#f7f8f9</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="n">surface-card</span><span class="v">#ffffff</span></div>
<div class="sw" style="background:var(--surface-sunken)"><span class="n">surface-sunken</span><span class="v">#eef0f2</span></div>
<div class="sw" style="background:var(--action-primary)"><span class="n">action-primary</span><span class="v">#90d850</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="n" style="color:var(--text-accent)">text-accent</span><span class="v">#5f9a2c</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="n">text-primary</span><span class="v">#0c0f15</span></div>
</div></body></html>
