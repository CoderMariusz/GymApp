<!-- @dsCard group="Spacing" viewport="700x150" name="Hit targets" subtitle="44px minimum — one hand, sweaty, moving (C-5)" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Hit</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div style="display:flex;align-items:center;gap:14px">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<div style="width:44px;height:44px;border:1.5px dashed var(--border-accent);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-numeric);font-size:12px;color:var(--text-accent);font-weight:700">44</div>
<span class="t" style="font-size:9px">hit-min</span><span style="font-size:11px;color:var(--text-tertiary)">Every control</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<div style="width:52px;height:52px;border:1.5px dashed var(--border-accent);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-numeric);font-size:12px;color:var(--text-accent);font-weight:700">52</div>
<span class="t" style="font-size:9px">hit-primary</span><span style="font-size:11px;color:var(--text-tertiary)">Complete set</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<div style="width:56px;height:56px;border:1.5px dashed var(--border-accent);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-numeric);font-size:12px;color:var(--text-accent);font-weight:700">56</div>
<span class="t" style="font-size:9px">hit-nav</span><span style="font-size:11px;color:var(--text-tertiary)">Tab bar</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<div style="width:56px;height:56px;border:1.5px dashed var(--border-accent);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-numeric);font-size:12px;color:var(--text-accent);font-weight:700">56</div>
<span class="t" style="font-size:9px">fab-size</span><span style="font-size:11px;color:var(--text-tertiary)">Start workout</span></div>
</div></body></html>
