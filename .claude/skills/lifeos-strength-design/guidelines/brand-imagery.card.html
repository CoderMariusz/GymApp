<!-- @dsCard group="Brand" viewport="700x260" name="Approved imagery" subtitle="v1.0 ships two heroes: strength only, calm surface for UI" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Imagery</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div style="display:flex;gap:10px;height:200px">
<div style="flex:1.1;position:relative;border-radius:var(--radius-xl);overflow:hidden;border:1px solid var(--border-subtle)">
<img src="../assets/imagery/hero-dumbbell.png" style="width:100%;height:100%;object-fit:cover;object-position:60% 30%">
<div style="position:absolute;inset:0;background:var(--scrim-strong)"></div>
<div style="position:absolute;left:14px;bottom:12px"><div class="t" style="color:var(--lime-500)">Hero 1 · approved</div><div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:#fff">Man with heavy dumbbell</div></div></div>
<div style="flex:1;display:flex;flex-direction:column;gap:10px">
<div style="flex:1;position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-subtle)"><img src="../assets/imagery/hero-back-rack.png" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;background:var(--scrim-side)"></div><div style="position:absolute;left:12px;bottom:10px" class="t">Hero 2 · approved</div></div>
<div style="flex:1;position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-subtle)"><img src="../assets/imagery/hero-core-front.png" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;background:var(--scrim-side)"></div><div style="position:absolute;left:12px;bottom:10px" class="t">Card background</div></div>
</div>
<div style="flex:.85;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:12px">
<div class="t" style="color:var(--feedback-danger)">Held for later versions</div>
<ul style="margin:8px 0 0;padding-left:16px;font-size:11px;line-height:16px;color:var(--text-secondary)"><li>Runner — implies GPS</li><li>Smartwatch ECG — implies HR</li><li>Planner — v1.1</li><li>Meditation — v1.2</li></ul>
<div class="t" style="margin-top:12px">Rule</div><div style="font-size:11px;line-height:16px;color:var(--text-tertiary)">A photograph is a requirement claim. Never demonstrate technique.</div>
</div></div></body></html>
