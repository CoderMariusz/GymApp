<!-- @dsCard group="Colors" viewport="700x150" name="Text & border" subtitle="Three text levels, three border weights" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Text</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1.3;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px">
<div style="color:var(--text-primary);font-size:15px;font-weight:800">text-primary · #ffffff</div>
<div style="color:var(--text-secondary);font-size:13px;margin-top:6px">text-secondary · #8b95a3</div>
<div style="color:var(--text-tertiary);font-size:12px;margin-top:6px">text-tertiary · #5b6675</div>
<div style="color:var(--text-accent);font-size:13px;font-weight:800;margin-top:6px">text-accent · #90d850</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center">
<div style="border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:8px 10px"><span class="t">border-subtle · white 7%</span></div>
<div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px 10px"><span class="t">border-default · #1e242e</span></div>
<div style="border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 10px"><span class="t">border-strong · #2a323e</span></div>
<div style="border:1px solid var(--border-accent);border-radius:var(--radius-sm);padding:8px 10px"><span class="t" style="color:var(--text-accent)">border-accent · #90d850</span></div>
</div></div></body></html>
