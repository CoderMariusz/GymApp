ine-height:13px">Default curve</div></div><div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px"><div class="v" style="font-size:12px;color:var(--text-primary);font-weight:700">.97</div><div class="t" style="font-size:9px;margin-top:4px">press-scale</div><div style="font-size:10px;color:var(--text-tertiary);margin-top:4px;line-height:13px">Press feedback</div></div>
