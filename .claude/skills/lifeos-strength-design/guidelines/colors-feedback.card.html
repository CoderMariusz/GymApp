<!-- @dsCard group="Colors" viewport="700x130" name="Feedback" subtitle="Success, info, warning, danger — each with a quiet fill" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Feedback</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div class="g">
<div style="flex:1;border-radius:var(--radius-md);border:1px solid var(--border-subtle);overflow:hidden">
<div style="height:34px;background:var(--feedback-success)"></div>
<div style="height:34px;background:var(--feedback-success-quiet);display:flex;align-items:center;padding:0 10px"><span style="font-size:11px;font-weight:800;color:var(--feedback-success)">success</span></div>
<div style="padding:8px 10px"><span class="v">Lime · #90d850</span></div></div><div style="flex:1;border-radius:var(--radius-md);border:1px solid var(--border-subtle);overflow:hidden">
<div style="height:34px;background:var(--feedback-info)"></div>
<div style="height:34px;background:var(--feedback-info-quiet);display:flex;align-items:center;padding:0 10px"><span style="font-size:11px;font-weight:800;color:var(--feedback-info)">info</span></div>
<div style="padding:8px 10px"><span class="v">Blue · #4c8df6</span></div></div><div style="flex:1;border-radius:var(--radius-md);border:1px solid var(--border-subtle);overflow:hidden">
<div style="height:34px;background:var(--feedback-warning)"></div>
<div style="height:34px;background:var(--feedback-warning-quiet);display:flex;align-items:center;padding:0 10px"><span style="font-size:11px;font-weight:800;color:var(--feedback-warning)">warning</span></div>
<div style="padding:8px 10px"><span class="v">Amber · #f0a92b</span></div></div><div style="flex:1;border-radius:var(--radius-md);border:1px solid var(--border-subtle);overflow:hidden">
<div style="height:34px;background:var(--feedback-danger)"></div>
<div style="height:34px;background:var(--feedback-danger-quiet);display:flex;align-items:center;padding:0 10px"><span style="font-size:11px;font-weight:800;color:var(--feedback-danger)">danger</span></div>
<div style="padding:8px 10px"><span class="v">Red · #e5484d</span></div></div>
</div></body></html>
