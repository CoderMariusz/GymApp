<!-- @dsCard group="Colors" viewport="700x150" name="Set-entry semantics" subtitle="Proposal vs recorded fact vs active vs warm-up" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Set semantics</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:8px">
<div style="display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;background:transparent;border:1px solid transparent;border-radius:var(--radius-md);">
<span style="width:60px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700">logged</span>
<span style="flex:1;text-align:center;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--set-logged-text)">100</span>
<span style="flex:1;text-align:center;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--set-logged-text)">8</span>
<span style="width:26px;height:26px;border-radius:999px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--set-logged-mark);font-size:14px;font-weight:900">✓</span></div><div style="display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;background:var(--set-active-bg);border:1px solid var(--set-active-border);border-radius:var(--radius-md);">
<span style="width:60px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700">active</span>
<span style="flex:1;text-align:center;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--set-logged-text)">105</span>
<span style="flex:1;text-align:center;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--set-logged-text)">8</span>
<span style="width:26px;height:26px;border-radius:999px;border:2px solid var(--set-active-border);display:inline-flex;align-items:center;justify-content:center;color:var(--set-logged-mark);font-size:14px;font-weight:900"></span></div><div style="display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;background:transparent;border:1px solid transparent;border-radius:var(--radius-md);">
<span style="width:60px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700">proposed</span>
<span style="flex:1;text-align:center;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--set-proposed-text)">105</span>
<span style="flex:1;text-align:center;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--set-proposed-text)">8</span>
<span style="width:26px;height:26px;border-radius:999px;border:2px solid var(--set-proposed-border);display:inline-flex;align-items:center;justify-content:center;color:var(--set-logged-mark);font-size:14px;font-weight:900"></span></div><div style="display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;background:transparent;border:1px solid transparent;border-radius:var(--radius-md);border-left:3px solid var(--set-warmup-rail);">
<span style="width:60px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700">warm-up</span>
<span style="flex:1;text-align:center;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--set-warmup-text)">60</span>
<span style="flex:1;text-align:center;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--set-warmup-text)">10</span>
<span style="width:26px;height:26px;border-radius:999px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--set-logged-mark);font-size:14px;font-weight:900">✓</span></div>
</div></body></html>
