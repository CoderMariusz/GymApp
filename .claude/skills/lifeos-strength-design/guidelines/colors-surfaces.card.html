<!-- @dsCard group="Colors" viewport="700x140" name="Surfaces — dark" subtitle="Cool near-black ramp; cards sit one step above the screen" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div class="g">
<div class="sw" style="background:var(--backdrop)"><span class="n">backdrop</span><span class="v">#000000</span></div>
<div class="sw" style="background:var(--surface-sunken)"><span class="n">surface-sunken</span><span class="v">#04060a</span></div>
<div class="sw" style="background:var(--surface-base)"><span class="n">surface-base</span><span class="v">#070a0f</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="n">surface-card</span><span class="v">#0c0f15</span></div>
<div class="sw" style="background:var(--surface-raised)"><span class="n">surface-raised</span><span class="v">#12161d</span></div>
<div class="sw" style="background:var(--surface-inset)"><span class="n">surface-inset</span><span class="v">white 4%</span></div>
</div></body></html>
