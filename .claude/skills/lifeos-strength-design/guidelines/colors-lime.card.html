<!-- @dsCard group="Colors" viewport="700x140" name="Lime accent" subtitle="500 is the action fill; accent is punctuation, never the field" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Lime</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div class="g">
<div class="sw" style="background:var(--lime-300)"><span class="n" style="color:#04060a">lime-300</span><span class="v" style="color:#04060a">#c3e88a</span></div>
<div class="sw" style="background:var(--lime-400)"><span class="n" style="color:#04060a">lime-400</span><span class="v" style="color:#04060a">#a8d858</span></div>
<div class="sw" style="background:var(--lime-500)"><span class="n" style="color:#04060a">lime-500 · action</span><span class="v" style="color:#04060a">#90d850</span></div>
<div class="sw" style="background:var(--lime-600)"><span class="n" style="color:#04060a">lime-600 · press</span><span class="v" style="color:#04060a">#7cc13e</span></div>
<div class="sw" style="background:var(--lime-700)"><span class="n">lime-700 · light fg</span><span class="v">#5f9a2c</span></div>
<div class="sw" style="background:var(--lime-tint-16)"><span class="n">tint-16</span><span class="v">rgba(144,216,80,.16)</span></div>
</div></body></html>
