<!-- @dsCard group="Brand" viewport="700x220" name="Photo + UI" subtitle="Every hero carries a scrim so cards and text stay legible" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><title>Scrim</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-base)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.n{font-size:11px;font-weight:800;color:var(--text-primary)}.v{font-family:var(--font-numeric);font-size:10px;color:var(--text-tertiary);letter-spacing:.02em}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700}</style></head><body><div style="display:flex;gap:12px;height:170px">
<div style="flex:1;position:relative;border-radius:var(--radius-xl);overflow:hidden"><img src="../assets/imagery/hero-core-front.png" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;top:10px;left:12px" class="t" style="color:#fff">No scrim — unusable</div></div>
<div style="flex:1;position:relative;border-radius:var(--radius-xl);overflow:hidden"><img src="../assets/imagery/hero-core-front.png" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;background:var(--scrim-strong)"></div>
<div style="position:absolute;left:14px;right:14px;bottom:12px"><div style="font-family:var(--font-display);font-size:19px;font-weight:700;color:#fff;line-height:22px">Upper Body Strength</div><div style="font-size:12px;color:var(--ink-200);margin-top:2px">6 exercises · 18 sets</div>
<span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;margin-top:10px;background:var(--action-primary);color:var(--action-primary-text);border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase">Resume</span></div></div>
<div style="flex:.7;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:12px"><div class="t">Tokens</div><div style="font-size:11px;line-height:17px;color:var(--text-secondary);margin-top:6px">--scrim-strong<br>bottom-anchored copy<br><br>--scrim-side<br>left-anchored copy</div></div>
</div></body></html>
